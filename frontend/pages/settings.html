<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Speed Detection System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-layout">
        <button class="hamburger" onclick="toggleSidebar()">&#9776;</button>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>SpeedDetect</h2>
                <p>Traffic Violation System</p>
            </div>
            <nav>
                <a href="/pages/dashboard.html"><span class="icon">&#9632;</span> Dashboard</a>
                <a href="/pages/cameras.html"><span class="icon">&#128247;</span> Cameras</a>
                <a href="/pages/violations.html"><span class="icon">&#9888;</span> Violations</a>
                <a href="/pages/reports.html"><span class="icon">&#128202;</span> Reports</a>
                <a href="/pages/settings.html" class="active"><span class="icon">&#9881;</span> Settings</a>
            </nav>
            <a href="#" class="logout" onclick="logout()">Logout</a>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
        <main class="main-content">
            <div class="page-header">
                <h1>Account Settings</h1>
            </div>
            <div class="form-card">
                <h2>Profile Information</h2>
                <div id="userInfo" style="margin-bottom:24px;color:#666;font-size:14px;">Loading...</div>

                <form id="profileForm">
                    <div class="form-group">
                        <label>Current Password *</label>
                        <input type="password" id="currentPassword" required placeholder="Enter current password to confirm changes">
                    </div>
                    <div class="form-group">
                        <label>New Username</label>
                        <input type="text" id="newUsername" placeholder="Leave blank to keep current">
                    </div>
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="newPassword" placeholder="Leave blank to keep current">
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" id="confirmPassword" placeholder="Repeat new password">
                    </div>
                    <div id="msg" class="error-msg" style="display:none;"></div>
                    <div id="successMsg" style="display:none;color:#27ae60;font-size:14px;margin-top:10px;text-align:center;"></div>
                    <button type="submit" class="btn btn-primary" style="margin-top:16px;">Update Profile</button>
                </form>
            </div>
        </main>
    </div>
    <script src="/js/auth.js"></script>
    <script src="/js/settings.js"></script>
</body>
</html>
